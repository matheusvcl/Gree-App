name: release

# Dispara com tag (git tag v1.0.1 && git push --tags)
# ou manualmente: gh workflow run release.yml -f version=1.0.1
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 1.0.1)'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # libera espaço: o runner vem lotado de toolchains que não usamos
      # (dotnet, ghc, swift, CodeQL...) e os caches + build precisam de folga
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/miniconda \
            /usr/local/share/powershell \
            /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/ndk || true
          df -h /

      # cache de build: restaura o anterior, e cada run salva um novo
      # (o passo final apaga os antigos, mantendo só o mais recente)
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.run_id }}
          restore-keys: |
            gradle-

      - name: Versão
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/gree-release.jks
          cat > android/key.properties <<EOF
          storeFile=gree-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=$(date +%s) \
            --dart-define=UPDATE_TOKEN="$UPDATE_TOKEN"

      - name: Notas do changelog
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            /^## / {
              key = "## v" ver
              if (index($0, key) == 1) {
                rest = substr($0, length(key) + 1, 1)
                if (rest !~ /[0-9.]/) { f = 1; next }
              }
              f = 0
              next
            }
            f { print }
          ' docs/changelog/CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::Seção '## v${{ steps.ver.outputs.version }}' não existe em docs/changelog/CHANGELOG.md — atualize o changelog antes de lançar."
            exit 1
          fi

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "Gree-v${{ steps.ver.outputs.version }}.apk"
          gh release create "v${{ steps.ver.outputs.version }}" \
            "Gree-v${{ steps.ver.outputs.version }}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file /tmp/notes.md \
            --latest

      - name: Limpar caches antigos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key gradle- --json key --jq '.[].key' \
            | grep -v "^gradle-${{ github.run_id }}$" \
            | xargs -r -I{} gh cache delete {} --repo "$GITHUB_REPOSITORY" || true
