name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # cache de build (mesmo do release.yml): restaura o anterior, cada run
      # salva um novo e o passo final apaga os antigos, mantendo só o mais recente
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.run_id }}
          restore-keys: |
            gradle-

      - name: Dependências
        run: flutter pub get

      - name: Análise estática (zero erros)
        run: flutter analyze --no-fatal-infos

      - name: Testes (unitários + widget)
        run: flutter test tests --coverage

      - name: Cobertura
        run: |
          TOTAL=$(grep -oP 'LF:\K[0-9]+' coverage/lcov.info | paste -sd+ | bc)
          HIT=$(grep -oP 'LH:\K[0-9]+' coverage/lcov.info | paste -sd+ | bc)
          echo "Linhas cobertas: $HIT de $TOTAL"
          echo "### Cobertura: $(awk "BEGIN {printf \"%.1f%%\", 100*$HIT/$TOTAL}")" >> "$GITHUB_STEP_SUMMARY"

      - name: Compilação (APK debug)
        run: flutter build apk --debug

      - name: Verificar assinatura da release
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sem keystore nos secrets — pulando verificação de assinatura"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/verifica-release.jks
          cat > android/verifica.properties <<EOF
          storeFile=verifica-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/verifica.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs /tmp/verifica.apk | grep "certificate DN"
          rm -f android/app/verifica-release.jks android/verifica.properties /tmp/verifica.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Enviar cobertura
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

      - name: Limpar caches antigos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key gradle- --json key --jq '.[].key' \
            | grep -v "^gradle-${{ github.run_id }}$" \
            | xargs -r -I{} gh cache delete {} --repo "$GITHUB_REPOSITORY" || true
