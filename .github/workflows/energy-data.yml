name: energy-data

# Atualiza docs/data/energy.json (bandeira + tarifas da ANEEL) toda semana
# e a cada release. O app lê esse JSON para calcular a tarifa sozinho.
on:
  schedule:
    - cron: '0 12 * * 1'  # segundas, 12:00 UTC
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # sempre em main (tags disparam em HEAD destacado)

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Buscar dados da ANEEL
        run: python3 scripts/fetch_energy.py

      - name: Commit
        run: |
          git config user.name "gree-bot"
          git config user.email "actions@github.com"
          git add docs/data/energy.json
          git diff --cached --quiet || git commit -m "dados: bandeira e tarifas da ANEEL"
          git push
